<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloom Pour – Pour Over Orders</title>
<style>
:root{--bg:#DEE5DE;--accent:#98a7c8;--text:#8595a4;--grey:#c1cbd4;--ink:#3d4a57;--card:rgba(255,255,255,.55);--line:#98a7c8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.45}
main{max-width:640px;margin:0 auto;padding:32px 16px 64px}
h1{margin:0;text-align:center;font-size:clamp(40px,12vw,64px);color:var(--accent);letter-spacing:1px;line-height:1.05}
.sub{text-align:center;font-size:20px;margin:6px 0 18px;text-transform:uppercase}
hr{border:0;border-top:3px solid var(--line);margin:18px 0}
.info{text-align:center;font-size:16px;margin:0 0 6px}
.info b{color:var(--accent)}
.card{background:var(--card);border:3px solid var(--line);border-radius:26px;padding:20px 22px;margin:16px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.name{font-size:22px;font-weight:bold}.price{font-size:26px;font-weight:bold;color:var(--ink)}
.card.out,.card.out .price{color:var(--grey);border-color:var(--grey)}
.card.out .name{text-decoration:line-through}
.val{font-size:16px;margin-top:4px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);background:transparent;color:var(--accent);font-size:22px;cursor:pointer}
.stepper button:disabled{opacity:.35;cursor:default}
.qty{min-width:24px;text-align:center;font-size:22px;font-weight:bold}
.left{font-size:13px}.soldout{color:var(--grey);font-weight:bold}
h2{font-size:18px;margin:26px 0 8px;text-transform:uppercase;color:var(--accent)}
label{display:block;font-size:14px;margin:12px 0 4px}
input[type=text],input[type=tel],select,textarea{width:100%;padding:12px;font-size:16px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-family:inherit}
.opt{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:16px}
.opt input{margin-top:4px;accent-color:var(--accent)}
.hint{font-size:13px;margin-top:4px}
.total{display:flex;justify-content:space-between;font-size:22px;font-weight:bold;margin:22px 0 10px}
.btn{width:100%;padding:16px;font-size:18px;font-weight:bold;border:0;border-radius:14px;background:var(--accent);color:var(--ink);cursor:pointer}
.btn:disabled{opacity:.5}
.err{background:#fff;border:2px solid #c0392b;color:#c0392b;border-radius:12px;padding:10px 12px;margin-top:12px;display:none}
.hp{position:absolute;left:-9999px}
.done{text-align:center}
.done img{width:240px;max-width:80%;border-radius:12px;background:#fff;padding:8px}
.wa{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#fff;font-weight:bold;text-decoration:none;padding:12px 18px;border-radius:12px}
.back{margin-top:6px;background:none;border:2px solid var(--accent);color:var(--accent);font-size:16px;font-weight:bold;padding:10px 16px;border-radius:12px;cursor:pointer}
.notice{background:#fff;border:2px solid var(--accent);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.done .back{display:block;margin:6px auto}
.foot{display:block;text-align:center;text-decoration:none;margin-top:8px}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <h1>BLOOM POUR</h1>
  <div class="sub">Pour over menu</div>
  <hr>
  <div id="info" class="info"></div>
  <div id="app"><p class="info">Loading menu…</p></div>
  <hr>
  <a class="btn foot" href="/coffees">Our coffees</a>
</main>
<script>
const $ = (s) => document.querySelector(s);
const el = (t, props = {}, ...kids) => { const e = Object.assign(document.createElement(t), props); kids.flat().forEach(k => e.append(k)); return e; };
let M, remaining, qty = {}, notice = '';

async function load() {
  const r = await fetch('/api/menu'); const d = await r.json();
  M = d.menu; remaining = d.remaining; M.items.forEach(i => qty[i.id] = Math.min(qty[i.id] ?? 0, remaining[i.id]));
  render();
}

function cups() { return M.items.reduce((s, i) => s + qty[i.id], 0); }
function total() { return M.items.reduce((s, i) => s + qty[i.id] * i.price, 0); }

function render() {
  const info = $('#info'); info.replaceChildren(
    el('div', {}, el('b', {textContent: `${M.eventDate} · ${M.hours}`})),
    el('div', {textContent: M.notes.join(' · ')}),
    el('div', {textContent: `Free delivery within ${M.estate} for ${M.freeDeliveryMinCups} cups or more. Fewer than ${M.freeDeliveryMinCups}: self-collection at ${M.collectionPoint}.`}));

  const soldOut = M.items.every(i => remaining[i.id] === 0);
  const app = $('#app');
  if (soldOut) { app.replaceChildren(el('div', {className: 'card done'}, el('h2', {textContent: 'All sold out'}), 'Thank you for your support!')); return; }

  const form = el('form', {id: 'f', noValidate: true});
  M.items.forEach(i => {
    const left = remaining[i.id];
    const stepper = el('div', {className: 'stepper'});
    const minus = el('button', {type: 'button', textContent: '–', ariaLabel: `Less ${i.name}`, disabled: qty[i.id] === 0});
    const plus = el('button', {type: 'button', textContent: '+', ariaLabel: `More ${i.name}`, disabled: qty[i.id] >= left});
    minus.onclick = () => { qty[i.id]--; render(); keep(); };
    plus.onclick = () => { qty[i.id]++; render(); keep(); };
    stepper.append(minus, el('span', {className: 'qty', textContent: qty[i.id]}), plus);
    form.append(el('div', {className: 'card' + (left ? '' : ' out')},
      el('div', {className: 'row'}, el('span', {className: 'name', textContent: [i.origin, i.name].filter(Boolean).join(' ')}), el('span', {className: 'price', textContent: `$${i.price}`})),
      el('div', {className: 'val', textContent: i.roast ? `${i.process} (${i.roast.replace(/\s*roast$/i, '').toLowerCase()} roast)` : i.process}),
      el('div', {className: 'val', textContent: i.taste}),
      el('div', {className: 'row', style: 'margin-top:14px'},
        el('span', left ? {className: 'left', textContent: `${left} cup${left > 1 ? 's' : ''} left`} : {className: 'soldout', textContent: 'SOLD OUT'}),
        left ? stepper : '')));
  });

  const delivery = cups() >= M.freeDeliveryMinCups;
  form.append(
    el('h2', {textContent: 'Your details'}),
    field('Name', 'text', 'name', 'name'), field('Contact number', 'tel', 'phone', 'tel'),
    el('h2', {textContent: 'Collection or delivery'}),
    radio('collection', `Self-collection at ${M.collectionPoint}`, true),
    radio('delivery', `Free delivery within ${M.estate} (${M.freeDeliveryMinCups} cups or more)`, false, !delivery),
    el('div', {id: 'addrWrap', className: 'hidden'}, field('Block and unit number', 'text', 'address', 'street-address')),
    el('label', {textContent: 'Preferred pick-up / delivery time'}),
    (() => { const s = el('select', {id: 'slot', required: true}); s.append(el('option', {value: '', textContent: 'Choose a time window'})); M.slots.forEach(t => s.append(el('option', {value: t, textContent: t}))); return s; })(),
    el('div', {className: 'hint', textContent: 'Pick-up: come by any time within your window. Delivery: arrives within your window.'}),
    el('label', {textContent: 'Notes (optional)'}), el('textarea', {id: 'notes', rows: 2}),
    el('input', {className: 'hp', id: 'website', tabIndex: -1, autocomplete: 'off', ariaHidden: 'true'}),
    el('div', {className: 'total'}, el('span', {textContent: `Total (${cups()} cup${cups() === 1 ? '' : 's'})`}), el('span', {textContent: `$${total()}`})),
    el('button', {className: 'btn', id: 'go', type: 'submit', textContent: 'Place order'}),
    el('div', {className: 'hint', textContent: 'After ordering you will see a PayNow QR to pay. Please add your name as the reference.'}),
    el('div', {className: 'err', id: 'err'}));
  if (notice) form.prepend(el('div', {className: 'notice', textContent: notice}));
  app.replaceChildren(form);
  restore();
  form.querySelectorAll('input[name=method]').forEach(r => r.onchange = toggleAddr);
  toggleAddr();
  form.onsubmit = submit;
}

function field(label, type, id, ac) {
  return el('div', {}, el('label', {htmlFor: id, textContent: label}), el('input', {type, id, autocomplete: ac}));
}
function radio(value, text, checked, disabled = false) {
  const i = el('input', {type: 'radio', name: 'method', value, checked, disabled});
  return el('label', {className: 'opt', style: disabled ? 'opacity:.5' : ''}, i, el('span', {textContent: text}));
}
function toggleAddr() {
  const d = document.querySelector('input[name=method]:checked')?.value === 'delivery';
  $('#addrWrap').classList.toggle('hidden', !d);
}

// keep typed values when the steppers re-render the form
let saved = {};
function keep() {}
function snapshot() { ['name', 'phone', 'address', 'slot', 'notes'].forEach(k => { const e = document.getElementById(k); if (e) saved[k] = e.value; }); const m = document.querySelector('input[name=method]:checked')?.value; if (m) saved.method = m; }
function restore() { ['name', 'phone', 'address', 'slot', 'notes'].forEach(k => { const e = document.getElementById(k); if (e && saved[k] != null) e.value = saved[k]; }); if (saved.method === 'delivery' && cups() >= M.freeDeliveryMinCups) document.querySelector('input[value=delivery]').checked = true; }
const _render = render; render = function () { snapshot(); _render(); };

async function submit(e) {
  e.preventDefault();
  const err = $('#err'); err.style.display = 'none';
  const body = {
    name: $('#name').value, phone: $('#phone').value, items: qty,
    method: document.querySelector('input[name=method]:checked')?.value,
    address: $('#address').value, slot: $('#slot').value, notes: $('#notes').value, website: $('#website').value,
  };
  $('#go').disabled = true;
  try {
    const r = await fetch('/api/order', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(body)});
    const d = await r.json();
    if (!r.ok) {
      err.textContent = d.error || 'Something went wrong.'; err.style.display = 'block';
      if (d.remaining) { remaining = d.remaining; M.items.forEach(i => qty[i.id] = Math.min(qty[i.id], remaining[i.id])); render(); $('#err').textContent = d.error; $('#err').style.display = 'block'; }
      $('#go') && ($('#go').disabled = false); return;
    }
    notice = '';
    done({...d.order, phone: body.phone.trim(), notes: body.notes.trim(), address: body.address.trim()});
  } catch { err.textContent = 'Network error, please try again.'; err.style.display = 'block'; $('#go').disabled = false; }
}

const WA_ICON = '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>';
function waLink(o, lines) {
  const msg = [
    'Hi Sally, here is my PayNow screenshot for my Bloom Pour order.',
    '',
    `Name: ${o.name}`,
    'Order:', ...lines.map(l => `- ${l}`),
    `Total: $${o.total}`,
    `${o.method === 'delivery' ? 'Delivery' : 'Pick-up'}: ${o.method === 'delivery' && o.address ? o.address + ', ' : ''}${o.slot}`,
    ...(o.notes ? [`Notes: ${o.notes}`] : []),
  ].join('\n');
  const a = el('a', {href: `https://wa.me/65${M.contactPhone}?text=${encodeURIComponent(msg)}`, target: '_blank', rel: 'noopener', className: 'wa'});
  a.innerHTML = WA_ICON;
  a.append(el('span', {textContent: 'Send your screenshot'}));
  return a;
}

async function editOrder(o) {
  if (!confirm('Cancel this order so you can change it? Your cups are released until you place a new order.')) return;
  try {
    const r = await fetch('/api/cancel', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({id: o.id})});
    const d = await r.json();
    if (!r.ok) { alert(d.error || 'Could not cancel. Please try again.'); return; }
  } catch { alert('Network error, please try again.'); return; }
  M.items.forEach(i => qty[i.id] = o.items[i.id] || 0);
  Object.assign(saved, {name: o.name, phone: o.phone, address: o.address, slot: o.slot, notes: o.notes, method: o.method});
  notice = 'Your previous order has been cancelled. Change what you need below and press Place order. Your cups are not reserved until you do.';
  await load(); window.scrollTo(0, 0);
}

function done(o) {
  const lines = M.items.filter(i => o.items[i.id]).map(i => `${o.items[i.id]} × ${i.name}`);
  $('#app').replaceChildren(el('div', {className: 'card done'},
    el('h2', {textContent: 'Order received ☕'}),
    el('p', {textContent: `Thank you, ${o.name}!`}),
    ...lines.map(l => el('div', {className: 'val', textContent: l})),
    el('p', {textContent: `${o.method === 'delivery' ? 'Delivery' : 'Collection'} · ${o.slot}`}),
    el('div', {className: 'total', style: 'justify-content:center;gap:12px'}, el('span', {textContent: 'Amount to pay:'}), el('span', {textContent: `$${o.total}`})),
    el('p', {textContent: 'Please pay via PayNow and add your name as the reference.'}),
    el('img', {src: '/paynow-qr.png', alt: 'PayNow QR code'}),
    el('p', {}, waLink(o, lines)),
    el('button', {type: 'button', className: 'back', textContent: 'Edit / cancel my order', onclick: () => editOrder(o)}),
    el('p', {className: 'hint', textContent: 'Editing cancels this order and releases your cups until you place a new one.'}),
    el('button', {type: 'button', className: 'back', textContent: '← Back to order page', onclick: () => { M.items.forEach(i => qty[i.id] = 0); notice = ''; load(); window.scrollTo(0, 0); }})));
  window.scrollTo(0, 0);
}
load();
</script>
</body>
</html>
